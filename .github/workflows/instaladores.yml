# Navega-MX — compila los instaladores para macOS, Windows, Linux y Android.
# GPL-3.0-or-later · (C) 2026 Santiago Miguel
name: Instaladores

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escritorio:
    name: Escritorio (${{ matrix.nombre }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: Linux
            script: dist:linux
          - os: windows-latest
            nombre: Windows
            script: dist:win
          - os: macos-latest
            nombre: macOS
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Herramientas para .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run check
      - name: Compilar
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prueba de humo (arranca la app real)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          NAVEGA_SMOKE: '1'
        run: xvfb-run -a --server-args="-screen 0 1360x880x24" ./dist/linux-unpacked/navega-mx --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: navega-mx-${{ matrix.nombre }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.AppImage

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Lista ampliada del bloqueador (StevenBlack/hosts, MIT)
        run: curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o android/app/src/main/assets/adblock/hosts.txt || echo "Se usará la lista básica"
      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: |
          V=$(grep versionName android/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk "salida/Navega-MX-$V-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: navega-mx-Android
          if-no-files-found: error
          path: salida/*.apk

  publicar:
    name: Publicar versión
    needs: [escritorio, android]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: ver
        run: echo "v=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - run: ls -la salida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Navega-MX ${{ steps.ver.outputs.v }}
          make_latest: true
          files: salida/*
          body: |
            ## Navega-MX ${{ steps.ver.outputs.v }} — navegador con IA de código abierto

            | Sistema | Archivo |
            |---|---|
            | Windows 10/11 (64 bits) | `Navega-MX-*-Windows-x64-Setup.exe` |
            | macOS Apple Silicon (M1–M4) | `Navega-MX-*-macOS-arm64.dmg` |
            | macOS Intel | `Navega-MX-*-macOS-x64.dmg` |
            | Linux Debian/Ubuntu/Mint | `Navega-MX-*-Linux-amd64.deb` |
            | Linux Fedora/openSUSE/RHEL | `Navega-MX-*-Linux-x86_64.rpm` |
            | Linux (cualquier distro) | `Navega-MX-*-Linux-x86_64.AppImage` |
            | Android 7.0 o superior | `Navega-MX-*-Android.apk` |

            **Para usar la IA** instala [Ollama](https://ollama.com) y un modelo abierto: `ollama pull qwen2.5:7b`.
            En escritorio también puedes elegir la *IA integrada (WebGPU)* en Ajustes, sin instalar nada.

            Los instaladores no están firmados con certificado comercial:
            - **macOS:** clic derecho → *Abrir* la primera vez (o `xattr -cr /Applications/Navega-MX.app`).
            - **Windows:** en SmartScreen elige *Más información → Ejecutar de todas formas*.
            - **Android:** permite *instalar apps de origen desconocido*.

            Licencia: GNU GPL v3 o posterior.
